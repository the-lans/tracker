[project]
name = "tracker-backend"
version = "0.1.0"
description = "AI-трекер задач — backend API и оркестрация Celery-задач"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy[asyncio]==2.1.4",
    "asyncpg==0.32.0",
    "alembic==1.20.0",
    "celery==5.6.3",
    "redis==8.1.0",
    "structlog==26.1.0",
    "claude-agent-sdk==0.2.164",
    "cryptography==50.0.1",
    "httpx==0.28.1",
    "croniter==6.2.4",
    "google-auth==2.58.0",
    "requests==2.34.2",
    "pywebpush==2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.10",
    "mypy==2.4.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "croniter.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pywebpush.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# celery.* не типизирован (ignore_missing_imports выше) — @celery_app.task
# как следствие "untyped", что делает untyped любую декорированную функцию
# в strict-режиме; отключается точечно там, где декоратор реально
# используется, а не глобально для всего проекта.
module = ["tasks.periodic", "tasks.session_worker"]
disable_error_code = ["untyped-decorator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# "function"-scoped event loop (умолчание pytest-asyncio) даёт каждому тесту
# новый loop, а engine из db/session.py — общий на процесс: пул соединений
# asyncpg привязан к loop, на котором создан, и падает с "another operation
# is in progress" при переиспользовании между тестами на разных loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
