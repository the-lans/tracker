[project]
name = "tracker-backend"
version = "0.1.0"
description = "AI-трекер задач — backend API и оркестрация Celery-задач"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy[asyncio]==2.1.8",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
    "celery==5.7.0",
    # Redis-транспорт Kombu импортирует packaging во время работы.
    "packaging==26.3",
    "redis==8.1.0",
    "structlog==26.1.0",
    "claude-agent-sdk==0.2.178",
    "cryptography==50.0.2",
    "httpx==0.28.1",
    "croniter==6.2.4",
    "google-auth==2.62.1",
    "requests==2.34.2",
    "pywebpush==2.5.0",
    "asyncssh==2.24.1",
    # Раздел 20.4: бэкап в S3-совместимое хранилище.
    "boto3==1.43.127",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
    "mypy==2.4.1",
    # Тесты конфигурации стека читают docker-compose.yml.
    "pyyaml==6.0.3",
    "types-PyYAML==6.0.12.20261103",
    "boto3-stubs[s3]==1.43.127",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "croniter.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pywebpush.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# celery.* не типизирован (ignore_missing_imports выше) — @celery_app.task
# как следствие "untyped", что делает untyped любую декорированную функцию
# в strict-режиме; отключается точечно там, где декоратор реально
# используется, а не глобально для всего проекта.
module = ["tasks.periodic", "tasks.session_worker", "tasks.jira_attachments"]
disable_error_code = ["untyped-decorator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# "function"-scoped event loop (умолчание pytest-asyncio) даёт каждому тесту
# новый loop, а engine из db/session.py — общий на процесс: пул соединений
# asyncpg привязан к loop, на котором создан, и падает с "another operation
# is in progress" при переиспользовании между тестами на разных loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
