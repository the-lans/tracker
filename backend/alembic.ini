# Конфигурация Alembic (async). Миграции физически лежат в корневом alembic/
# (раздел 20.3 ТЗ), alembic.ini — здесь, чтобы работали команды из CLAUDE.md
# (`cd backend && alembic ...`). Строка подключения не хранится тут —
# её единолично формирует alembic/env.py из переменной окружения DATABASE_URL.

[alembic]
# %(here)s — директория этого файла (backend/), поэтому путь ниже указывает
# на корневой alembic/ независимо от текущей рабочей директории.
script_location = %(here)s/../alembic

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = %(here)s

path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
