# Полное описание всех сервисов (раздел 20.3 ТЗ).

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Раздел 19.7, 20.3: LLM-прокси CLIProxyAPI. Конфигурацию с ключами из
  # .env раскладывает в его volume одноразовый cliproxy-init при каждом старте.
  cliproxy-init:
    image: alpine:3.22
    restart: "no"
    command: ["sh", "/opt/cliproxy/init.sh"]
    environment:
      CLIPROXY_API_KEY: ${CLIPROXY_API_KEY}
      CLIPROXY_MANAGEMENT_KEY: ${CLIPROXY_MANAGEMENT_KEY}
    volumes:
      - ./deploy/cliproxy:/opt/cliproxy:ro
      - cliproxy_data:/data

  # Собирается из репозитория прокси на закреплённом теге (его Dockerfile);
  # порты наружу не публикуются — доступ только из сети стека.
  cliproxy:
    build:
      context: https://github.com/router-for-me/CLIProxyAPI.git#${CLIPROXY_VERSION}
    image: tracker-cliproxy:${CLIPROXY_VERSION}
    restart: unless-stopped
    command: ["./CLIProxyAPI", "-config", "/data/config.yaml"]
    environment:
      TZ: UTC
    volumes:
      # Токены OAuth учёток — только здесь (раздел 19.4).
      - cliproxy_data:/data
    depends_on:
      cliproxy-init:
        condition: service_completed_successfully
    healthcheck:
      # В образе нет curl/wget: проверка, что порт принимает соединения.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8317"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # Раздел 19.7: шлюз между контейнерами сессий и прокси — по токену сессии
  # подставляет учётку, модель и уровень маршрута задачи. Тот же образ, что
  # backend, своя команда, без миграций и docker.sock.
  llm-gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    entrypoint: ["python", "-m", "llm_gateway"]
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CLIPROXY_URL: http://cliproxy:8317
      CLIPROXY_API_KEY: ${CLIPROXY_API_KEY}
      LLM_GATEWAY_PORT: "8320"
    networks:
      - default
      - llm_sessions
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      redis:
        condition: service_healthy
      cliproxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8320/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    environment: &backend_env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_CLAIMS_EMAIL: ${VAPID_CLAIMS_EMAIL}
      # Раздел 20.4: репозитории задач обязаны жить на именованном volume
      # (task_repos ниже), а не в writable-слое контейнера — без этой
      # переменной services/git_ops.py использует относительный дефолт
      # "tracker/repos" от текущей рабочей директории процесса, никак не
      # связанный с примонтированным /data/repos.
      TRACKER_REPOS_ROOT: /data/repos
      # Раздел 6.4: конфигурационные каталоги сессий задач с историей
      # диалогов — volume claude_sessions ниже.
      CLAUDE_SESSIONS_ROOT: /data/claude-sessions
      # Каталоги прежних LLM-аккаунтов: из них install.sh --update переносит
      # историю сессий задач (scripts/migrate_claude_sessions.py).
      CLAUDE_ACCOUNTS_ROOT: /data/claude-accounts
      # Раздел 19.7: management API LLM-прокси (вход в аккаунты, расход окон).
      CLIPROXY_MANAGEMENT_URL: http://cliproxy:8317
      CLIPROXY_MANAGEMENT_KEY: ${CLIPROXY_MANAGEMENT_KEY}
      # Раздел 15.5: версия собранного прокси для админки «LLM-прокси».
      CLIPROXY_VERSION: ${CLIPROXY_VERSION}
      # Раздел 19.3, 19.7: контейнер сессии подключается к изолированной сети,
      # где кроме него есть только llm-gateway.
      TRACKER_SESSION_LLM_NETWORK: ${COMPOSE_PROJECT_NAME:-tracker}-llm-sessions
      LLM_GATEWAY_URL: http://llm-gateway:8320
      # Раздел 14.3: артефакты задач — volume user_files ниже.
      TRACKER_USER_FILES_ROOT: /data/user-files
      ARTIFACT_MAX_UPLOAD_MB: ${ARTIFACT_MAX_UPLOAD_MB:-100}
      # Раздел 15.1, 20.5: инструкция подключения к SFTP-шлюзу в профиле и
      # пароль его роли БД (создаётся docker-entrypoint.sh).
      DOMAIN: ${DOMAIN}
      SFTP_PORT: ${SFTP_PORT:-2222}
      SFTP_DB_PASSWORD: ${SFTP_DB_PASSWORD}
      # Раздел 16.2: архив ротированной истории `node_logs` (rotate_task_logs).
      TRACKER_LOG_ARCHIVE_ROOT: /data/log-archive
      # Раздел 6.4: срок хранения истории сессий Claude Code (cleanupPeriodDays).
      CLAUDE_SESSION_RETENTION_DAYS: ${CLAUDE_SESSION_RETENTION_DAYS:-36500}
      # Раздел 19.3: CLI запускается в контейнере сессии той же версии, что
      # SDK (runners/tracker-session) — пробный `claude -v` с запуском
      # контейнера перед каждой сессией не нужен.
      CLAUDE_AGENT_SDK_SKIP_VERSION_CHECK: "1"
      # Раздел 14.4: воркер очереди не запускает больше задач, чем процессов
      # воркера сессий (session-worker, `--concurrency`).
      SESSION_WORKER_CONCURRENCY: ${SESSION_WORKER_CONCURRENCY:-4}
    volumes:
      - task_repos:/data/repos
      - user_files:/data/user-files
      # Через backend `install.sh --restore` распаковывает архивы всех volume.
      - log_archive:/data/log-archive
      - claude_accounts:/data/claude-accounts
      - claude_sessions:/data/claude-sessions
      # Раздел 15.1: отпечаток ключа SFTP-шлюза для профиля.
      - sftp_host_keys:/data/sftp-host-keys:ro
      # Раздел 20.5: доступ Celery worker/backend к Docker-демону хоста для запуска
      # script-нод и раннеров — задокументированный компромисс, без --privileged.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      cliproxy:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Периодические задачи (раздел 16): очередь `celery`.
  worker: &worker
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "tasks.celery_app", "worker", "-Q", "celery", "-l", "info"]
    environment: *backend_env
    volumes:
      - task_repos:/data/repos
      - claude_sessions:/data/claude-sessions
      - user_files:/data/user-files
      - log_archive:/data/log-archive
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Дожидается, пока backend впервые применит миграции (см.
      # backend/docker-entrypoint.sh) — worker не должен упереться в
      # ещё-не-созданную схему БД при холодном старте стека.
      backend:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy

  # Раздел 6.1, 20.3: сессии задач — своя очередь `sessions`. Сессия занимает
  # процесс часами (пауза, ожидание решения), поэтому число процессов —
  # верхняя граница одновременно работающих задач.
  session-worker:
    <<: *worker
    command:
      [
        "celery", "-A", "tasks.celery_app", "worker", "-Q", "sessions", "-O", "fair",
        "--concurrency", "${SESSION_WORKER_CONCURRENCY:-4}", "-l", "info",
      ]

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "tasks.celery_app", "beat", "-l", "info"]
    environment: *backend_env
    volumes:
      - task_repos:/data/repos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  # Раздел 2.1, 19.3, 20.5: SFTP-шлюз к файлам задач — тот же образ, своя
  # команда, без миграций и docker.sock. Репозитории — только чтение,
  # артефакты — запись; в БД — роль tracker_sftp с минимальными правами.
  sftp:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    entrypoint: ["python", "-m", "sftp_gateway"]
    environment:
      DATABASE_URL: postgresql+asyncpg://tracker_sftp:${SFTP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TRACKER_REPOS_ROOT: /data/repos
      TRACKER_USER_FILES_ROOT: /data/user-files
      SFTP_HOST_KEYS_DIR: /data/sftp-host-keys
    volumes:
      - task_repos:/data/repos:ro
      - user_files:/data/user-files
      - sftp_host_keys:/data/sftp-host-keys
    ports:
      - "${SFTP_PORT:-2222}:2222"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    # root в контейнере без остальных привилегий: читать и перезаписывать
    # файлы, созданные backend и worker.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 2222), 5).close()"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        # Тот же OAuth-клиент, что у backend (раздел 19.1): встраивается в бандл.
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  # Раздел 20.4: встроенный сервис резервного копирования PostgreSQL по
  # расписанию, настраиваемый через .env (POSTGRES_BACKUP_CRON,
  # POSTGRES_BACKUP_RETENTION_DAYS) — не отдельная ручная процедура.
  backup:
    build:
      context: ./deploy/backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_BACKUP_CRON: ${POSTGRES_BACKUP_CRON}
      POSTGRES_BACKUP_RETENTION_DAYS: ${POSTGRES_BACKUP_RETENTION_DAYS}
    volumes:
      - postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  # Раздел 20.4: репозитории задач (включая профили MCP-инструментов, раздел 10.3)
  # и пользовательские файлы задач — именованные Docker-volumes, раздельный жизненный цикл.
  task_repos:
  user_files:
  # Каталоги прежних LLM-аккаунтов (вход в CLI): источник переноса истории
  # сессий в claude_sessions; новых данных сюда не пишется.
  claude_accounts:
  # Раздел 6.4: конфигурационные каталоги сессий задач с историей диалогов.
  claude_sessions:
  # Раздел 19.4, 20.4: конфигурация LLM-прокси и его учётки с токенами OAuth.
  cliproxy_data:
  # Раздел 20.4: ключ хоста SFTP-шлюза — отпечаток сервера не меняется при переносе.
  sftp_host_keys:
  # Раздел 16.2: сжатые JSONL-архивы истории `node_logs`, переносятся вместе
  # с остальными данными (docs/migration.md).
  log_archive:
  caddy_data:
  caddy_config:
  postgres_backups:

networks:
  # Раздел 19.3, 19.7: сеть контейнеров сессий — без выхода к сервисам
  # стека, в ней только llm-gateway. Выход в интернет (MCP-серверы) у неё
  # есть: Docker не подключает контейнер к стандартной bridge вместе с
  # пользовательской сетью, и вторая сеть сессии невозможна. Имя
  # фиксировано: воркер подключает к ней контейнер сессии по имени
  # (TRACKER_SESSION_LLM_NETWORK).
  llm_sessions:
    name: ${COMPOSE_PROJECT_NAME:-tracker}-llm-sessions
