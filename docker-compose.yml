# Полное описание всех сервисов (раздел 20.3 ТЗ).

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment: &backend_env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_CLAIMS_EMAIL: ${VAPID_CLAIMS_EMAIL}
      # Раздел 20.4: репозитории задач обязаны жить на именованном volume
      # (task_repos ниже), а не в writable-слое контейнера — без этой
      # переменной services/git_ops.py использует относительный дефолт
      # "tracker/repos" от текущей рабочей директории процесса, никак не
      # связанный с примонтированным /data/repos.
      TRACKER_REPOS_ROOT: /data/repos
      # Раздел 16.2: архив ротированной истории `node_logs` (rotate_task_logs).
      TRACKER_LOG_ARCHIVE_ROOT: /data/log-archive
      # Раздел 6.4: срок хранения истории сессий Claude Code (cleanupPeriodDays).
      CLAUDE_SESSION_RETENTION_DAYS: ${CLAUDE_SESSION_RETENTION_DAYS:-36500}
    volumes:
      - task_repos:/data/repos
      - user_files:/data/user-files
      # Через backend `install.sh --restore` распаковывает архивы всех volume.
      - log_archive:/data/log-archive
      # Раздел 20.5: доступ Celery worker/backend к Docker-демону хоста для запуска
      # script-нод и раннеров — задокументированный компромисс, без --privileged.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "tasks.celery_app", "worker", "-l", "info"]
    environment: *backend_env
    volumes:
      - task_repos:/data/repos
      - user_files:/data/user-files
      - log_archive:/data/log-archive
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Дожидается, пока backend впервые применит миграции (см.
      # backend/docker-entrypoint.sh) — worker не должен упереться в
      # ещё-не-созданную схему БД при холодном старте стека.
      backend:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "tasks.celery_app", "beat", "-l", "info"]
    environment: *backend_env
    volumes:
      - task_repos:/data/repos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  # Раздел 20.4: встроенный сервис резервного копирования PostgreSQL по
  # расписанию, настраиваемый через .env (POSTGRES_BACKUP_CRON,
  # POSTGRES_BACKUP_RETENTION_DAYS) — не отдельная ручная процедура.
  backup:
    build:
      context: ./deploy/backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_BACKUP_CRON: ${POSTGRES_BACKUP_CRON}
      POSTGRES_BACKUP_RETENTION_DAYS: ${POSTGRES_BACKUP_RETENTION_DAYS}
    volumes:
      - postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  # Раздел 20.4: репозитории задач (включая профили MCP-инструментов, раздел 10.3)
  # и пользовательские файлы задач — именованные Docker-volumes, раздельный жизненный цикл.
  task_repos:
  user_files:
  # Раздел 16.2: сжатые JSONL-архивы истории `node_logs`, переносятся вместе
  # с остальными данными (docs/migration.md).
  log_archive:
  caddy_data:
  caddy_config:
  postgres_backups:
