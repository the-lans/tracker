server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA-фолбэк: клиентские маршруты (react-router) отдаются через index.html,
    # иначе прямая ссылка или обновление страницы дают 404.
    # index.html не кешируется: после обновления браузер сразу берёт новый,
    # а не ссылается на удалённый бандл прежней сборки (пустая страница).
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Отсутствующий бандл — честный 404, а не index.html под видом JS
    # (иначе старая вкладка после деплоя ловит невнятную MIME-ошибку).
    # Имена бандлов содержат хеш содержимого — кешируются навсегда.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
