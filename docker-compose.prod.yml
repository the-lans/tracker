# Override для production (раздел 20.3 ТЗ): реплики воркеров, лимиты ресурсов,
# restart-политики. Применяется поверх docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Заготовка: конкретные значения лимитов/реплик — дефолты, требуют подбора под
# реальную нагрузку и характеристики хоста на этапе эксплуатации.

services:
  backend:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  # Периодические задачи — короткие, одного процесса на очередь `celery` хватает.
  worker:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  # Сессии задач: на каждую — процесс Claude Code CLI. Число одновременных
  # сессий — SESSION_WORKER_CONCURRENCY (.env); лимиты подбираются под него.
  session-worker:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G

  beat:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  sftp:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  frontend:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  caddy:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  postgres:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  redis:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  backup:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
