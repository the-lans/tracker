# Override для production (раздел 20.3 ТЗ): реплики воркеров, лимиты ресурсов,
# restart-политики. Применяется поверх docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Заготовка: конкретные значения лимитов/реплик — дефолты, требуют подбора под
# реальную нагрузку и характеристики хоста на этапе эксплуатации.

services:
  backend:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  worker:
    restart: always
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  beat:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  frontend:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  caddy:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  postgres:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  redis:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
