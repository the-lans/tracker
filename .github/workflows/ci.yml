name: CI

"on":
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # make check сам устанавливает зависимости backend (backend/.venv через
      # pip install -e ".[dev]") и frontend (npm install), затем прогоняет
      # ruff → mypy → pytest и eslint → tsc --noEmit (см. Makefile, CLAUDE.md
      # раздел 4). Никаких деплой-шагов на этом этапе.
      - name: make check
        env:
          PYTHON: python
        run: make check
