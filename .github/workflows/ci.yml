name: CI

# Ветки проверяются в PR, `main` — после слияния (по нему же стартует
# deploy.yml): push в ветку PR не запускает второй такой же прогон.
"on":
  push:
    branches: [main]
  pull_request:

# Новый пуш в PR отменяет устаревший прогон. Идущий прогон `main` не
# прерывается (прерванный не дал бы развёртывания): прогоны `main` идут по
# очереди, а ожидающий заменяется прогоном более нового коммита.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Обычный прогон — около 20 минут; зависший тест не держит раннер 6 часов.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Тесты script-нод запускают реальные контейнеры раннеров
      # (backend/tests/test_nodes_script.py) — образы нужно собрать заранее.
      - name: Build script runner images
        run: |
          docker build -t tracker-runner-python:latest runners/tracker-runner-python/
          docker build -t tracker-runner-bash:latest runners/tracker-runner-bash/
          docker build -t tracker-session:latest runners/tracker-session/
          bash scripts/smoke_twg_image.sh

      # make check сам устанавливает зависимости backend (backend/.venv через
      # pip install -e ".[dev]") и frontend (npm install), затем прогоняет
      # ruff → mypy → pytest и eslint → tsc --noEmit → vitest run (см. Makefile, CLAUDE.md
      # раздел 4). Никаких деплой-шагов на этом этапе.
      - name: make check
        env:
          PYTHON: python
        run: make check

      - name: Smoke test backend image
        run: bash scripts/smoke_backend_image.sh

      # Продовый образ фронтенда: сборка на версии Node из Dockerfile и
      # SPA-маршруты nginx (make check собирает фронтенд только на Node из CI).
      - name: Smoke test frontend image
        run: scripts/smoke_frontend_image.sh
